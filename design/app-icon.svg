<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37465f"/><stop offset="1" stop-color="#1b2435"/></linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34435c"/><stop offset="1" stop-color="#202a3d"/></linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f6e4b8"/><stop offset="1" stop-color="#c8a265"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa3c4" stop-opacity="0.2"/><stop offset="0.5" stop-color="#b9c7de" stop-opacity="0.9"/><stop offset="1" stop-color="#8fa3c4" stop-opacity="0.2"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#05080f" flood-opacity="0.45"/></filter>
  </defs>
  <!-- PocketTray App-Icon: Dreiecke in der Tasche, Sandgold. Export: 256 px nach files/PocketTray@spex/icon.png -->
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#bg)"/>
    <!-- feiner Glanz oben -->
    <rect x="8" y="8" width="240" height="2" fill="#ffffff" opacity="0.12"/>
    <!-- Inhalt der Tasche -->
    <g filter="url(#sh)">
      <path d="M 128 50 L 162 108 L 94 108 Z" fill="url(#tri)"/>
      <path d="M 92 120 L 124 175 L 60 175 Z" fill="url(#tri)"/>
      <path d="M 164 120 L 196 175 L 132 175 Z" fill="url(#tri)"/>
    </g>
    <!-- Taschen-Vorderseite mit V-Kante -->
    <path d="M 0 138 L 128 190 L 256 138 L 256 256 L 0 256 Z" fill="url(#pocket)" filter="url(#sh)"/>
    <path d="M 0 138 L 128 190 L 256 138" fill="none" stroke="url(#rim)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 12 151 L 128 198 L 244 151" fill="none" stroke="#5f7394" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
</svg>
